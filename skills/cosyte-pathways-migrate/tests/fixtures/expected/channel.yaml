# yaml-language-server: $schema=../../node_modules/@cosyte/pathways/schema/channel.json
# Converted by the cosyte-pathways-migrate skill from an exported channel, for Pathways 0.0.3. It
# is a starting point, not a proved conversion: a conversion is proved only against input and
# output pairs your team supplies, de-identified. migration/synth-adt-feed/MIGRATION-REPORT.md
# lists what was converted, what carries a flag and what was not converted. Every destination runs
# dry until you remove its dryRun line.

name: synth-adt-feed
format: hl7v2

source:
  # SRC "TCP Listener": converted, with a flag. An MLLP source on 127.0.0.1 without TLS, as the
  # skill runs it; set host and tls before it takes traffic from another machine.
  mllp:
    port: 6661
    host: "127.0.0.1"
    plaintext: true

transform: ./transform.ts

destinations:
  # D1 "Archive": converted, with a flag. A file destination on the exported folder; Pathways names
  # each file itself, so the exported file name pattern was not converted.
  - file:
      dir: "/var/synth/archive"
    dryRun: true
  # D2 "Results API": converted, with a flag. An HTTP destination that POSTs; the exported method,
  # content type and query were not converted; its user name and password became the Authorization
  # header, read from SYNTH_ADT_FEED_D2_AUTHORIZATION, which you set.
  - http:
      url: "https://results.example.test/api/adt"
      headers:
        Authorization:
          env: SYNTH_ADT_FEED_D2_AUTHORIZATION
    dryRun: true
  # D3 "To Billing": not converted. Pathways 0.0.3 has no channel destination: send to the other
  # channel over a file folder or MLLP on 127.0.0.1, or wait for routing between channels in a later
  # release.

# The exported configuration map, as ctx.config. A secret is read from the environment.
config:
  siteCode: "SYNTHSITE"
  resultsApiPassword:
    env: RESULTS_API_PASSWORD
