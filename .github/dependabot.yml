version: 2
updates:
  # This repository has no npm dependencies (scripts/check.mjs uses Node's standard library only),
  # so GitHub Actions references are the only thing to keep current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Wait a day after a release before proposing it. Security updates are not delayed.
    cooldown:
      default-days: 1
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Kept identical to every Cosyte repository's Dependabot file; this repo does not use it.
      - dependency-name: reviewdog/action-actionlint
