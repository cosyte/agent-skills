name: Scorecard

# OpenSSF Scorecard supply-chain analysis through the shared workflow, called the way the libraries
# call it, at the published reference every Cosyte repository uses. It runs on main only:
# publishing the results needs the default branch, so its first run is the push that merges it.
#
# No `timeout-minutes` here: a job that calls a reusable workflow cannot set one. The timeout
# belongs to the shared job, and arrives when this caller moves to a reference that has it.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Tuesday 03:47 UTC. An odd minute: GitHub delays scheduled runs at the start of every hour.
    - cron: "47 3 * * 2"

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      contents: read # required to resolve the reusable workflow (else contents:none and a startup failure)
      security-events: write # upload the SARIF to the Security tab
      id-token: write # publish results to the OpenSSF API (for the badge)
    uses: cosyte/.github/.github/workflows/scorecard.yml@workflows-2026-11-07-498c7c13c886
