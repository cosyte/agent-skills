name: PR title

# A thin caller of the shared Conventional Commits check (ST24): with squash merges the pull
# request title becomes the commit on main, so the title is what gets checked. The check itself
# lives once, in cosyte/.github, at the published workflows reference every Cosyte repo uses.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

# No concurrency group: a run cancelled by a newer push or title edit can report as a failed
# required check and block the merge until someone re-runs it. Every run is short, so each is
# left to finish and the newest result stands.

permissions:
  contents: read

jobs:
  pr-title:
    permissions:
      contents: read
    uses: cosyte/.github/.github/workflows/pr-title.yml@workflows-2026-11-08-c0db8d8e5927
