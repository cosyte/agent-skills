name: actionlint

# Lints every workflow file with actionlint, and the shell in their `run:` steps through its
# shellcheck integration, on every pull request and push to main. Any finding fails the job.
#
# A JOB OF ITS OWN, because the published workflows reference has no standalone actionlint
# workflow: its actionlint job lives inside the shared library CI, which needs a pnpm package this
# repository does not have. The steps below are that job's steps, release cache included, at
# `workflows-2026-11-08-c0db8d8e5927`, as examples carries them.
#
# WHY A PINNED BINARY, and not reviewdog/action-actionlint: from v1.75.0 that action installs
# actionlint from a fork (kjanat/actionlint) with a `curl | bash`, not from rhysd/actionlint. Here
# the official release is downloaded at one version and checked against the SHA-256 written below,
# so a changed asset fails the job. Dependabot cannot see this pin: move the version and the
# SHA-256 together, by hand, from the release page.
#
# shellcheck is preinstalled on the hosted runner. actionlint silently skips its shellcheck
# integration when shellcheck is absent, so the job refuses to run without it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # THE RELEASE TARBALL IS CACHED, keyed on the version and the SHA-256, so a run that finds it
      # never asks GitHub's release downloads, which answered 504 for hours on 2026-11-08. The cache
      # is only where the bytes come from: the install step checks the SHA-256 of whatever it
      # unpacks, cached or downloaded. A cache that cannot be reached is a miss, never a failure.
      # These three steps are the shared actionlint job's, at the reference named above.
      - name: Restore the actionlint release from the cache
        id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint-cache
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-linux-amd64-${{ env.ACTIONLINT_SHA256 }}

      - name: Install actionlint at the pinned version and checksum
        shell: bash
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cache_dir="${RUNNER_TEMP}/actionlint-cache"
          if [ -f "${cache_dir}/${tarball}" ] \
            && echo "${ACTIONLINT_SHA256}  ${cache_dir}/${tarball}" | sha256sum -c --status -; then
            echo "actionlint ${ACTIONLINT_VERSION}: the cached release matches the pinned SHA-256."
          else
            if [ -f "${cache_dir}/${tarball}" ]; then
              echo "::warning::the cached actionlint release does not match the pinned SHA-256, so it is downloaded again"
            fi
            mkdir -p "${cache_dir}"
            curl -fsSL --retry 5 --retry-connrefused --retry-max-time 120 --connect-timeout 20 \
              -o "${cache_dir}/${tarball}" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          fi
          echo "${ACTIONLINT_SHA256}  ${cache_dir}/${tarball}" | sha256sum -c -
          tar -xzf "${cache_dir}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" --version
          shellcheck --version

      # Saved only on a miss, straight after the checked install, so a run whose lint fails still
      # seeds the cache with a tarball whose SHA-256 was just checked.
      - name: Save the actionlint release to the cache
        if: ${{ steps.actionlint-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint-cache
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}

      - name: actionlint over .github/workflows/
        shell: bash
        run: |
          set -euo pipefail
          listed="$(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')"
          if [ -z "${listed}" ]; then
            echo "::error::no workflow file found under .github/workflows/"
            exit 1
          fi
          mapfile -t files <<< "${listed}"
          "${RUNNER_TEMP}/actionlint" -color "${files[@]}"
          echo "actionlint clean over ${#files[@]} workflow file(s)."
